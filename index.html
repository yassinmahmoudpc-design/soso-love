<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إلى إسراء</title>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--white:#fffaf8;--rose:#f6e6e6;--burg:#6d1428;--deep:#4a0b1b;--soft:#a35567}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--white);color:var(--deep);font-family:'Amiri','Traditional Arabic',Tahoma,serif;font-size:1.25rem;line-height:2.1;overflow-x:hidden}
.script{font-family:'Aref Ruqaa','Amiri',serif}

/* hero */
.hero{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem 1.2rem;position:relative}
.hero .to{color:var(--soft);font-size:1.2rem}
.name{font-weight:700;font-size:clamp(5rem,26vw,10rem);line-height:1.1;color:var(--burg)}
.eyewrap{width:min(92vw,34rem);aspect-ratio:2/1;margin:.6rem 0 1rem;position:relative;cursor:pointer;filter:drop-shadow(0 14px 22px rgba(109,20,40,.35))}
